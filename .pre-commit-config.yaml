# Git hooks that run before every commit.
# Set up once with: uv run pre-commit install
# Run on all files:  uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      # Sort and group imports.
      - id: ruff-check
        name: ruff (sort imports)
        args: [--select, I, --fix]
      # Format the code.
      - id: ruff-format
