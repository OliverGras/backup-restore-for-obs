name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Use the official Python from actions/setup-python, not one downloaded by uv.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
