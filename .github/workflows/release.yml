# Builds the apps from the tagged source and puts them in a DRAFT release.
# Review the draft on GitHub, then publish it.
#
# Trigger: push a tag with the app version, e.g. 1.0.0 or v1.0.0
#   (git tag 1.0.0 && git push origin 1.0.0)
# The tag must match __version__ in src/obs_backup/__init__.py.
#
# Code signing can be added here later: SignPath Foundation and OSSign both
# require that signed files come from this automated build.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*", "[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  # Use the official Python from actions/setup-python (its license is bundled
  # in the app), not one downloaded by uv.
  UV_PYTHON_PREFERENCE: only-system

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Backup-Restore-for-OBS-windows.exe
          - os: ubuntu-22.04
            asset: Backup-Restore-for-OBS-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(uv run python -c "import obs_backup; print(obs_backup.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version (src/obs_backup/__init__.py)"
            exit 1
          fi
      - run: uv run pytest -q
      - run: uv run python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: move dist\Backup-Restore-for-OBS.exe ${{ matrix.asset }}
        shell: cmd

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist Backup-Restore-for-OBS

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS.txt
      - name: Fill in repository links
        run: sed -i "s|REPO_URL|${{ github.server_url }}/${{ github.repository }}|g" .github/RELEASE_NOTES_TEMPLATE.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: assets/*
          body_path: .github/RELEASE_NOTES_TEMPLATE.md
          generate_release_notes: true
