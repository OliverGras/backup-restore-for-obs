# Builds standalone apps and attaches them to a GitHub release.
# Trigger: push a tag such as v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: OBS-Backup-windows.exe
          - os: macos-latest
            asset: OBS-Backup-macos.zip
          - os: ubuntu-22.04
            asset: OBS-Backup-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name OBS-Backup --paths src src/obs_backup/__main__.py
          move dist\OBS-Backup.exe ${{ matrix.asset }}
        shell: cmd

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "OBS Backup" --osx-bundle-identifier io.github.obsbackup --paths src src/obs_backup/__main__.py
          ditto -c -k --keepParent "dist/OBS Backup.app" ${{ matrix.asset }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name OBS-Backup --paths src src/obs_backup/__main__.py
          tar -czf ${{ matrix.asset }} -C dist OBS-Backup

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
