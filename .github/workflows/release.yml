# Builds the apps from the tagged source and puts them in a DRAFT release.
# Review the draft on GitHub, then publish it.
#
# Trigger: push a tag such as v0.1.0  (git tag v0.1.0 && git push origin v0.1.0)
#
# Code signing (Windows) via SignPath Foundation is added here once the
# SignPath project is approved; SignPath requires that signed files come from
# this automated build.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: OBS-Backup-Restore-windows.exe
          - os: macos-latest
            asset: OBS-Backup-Restore-macos.zip
          - os: ubuntu-22.04
            asset: OBS-Backup-Restore-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python packaging/build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: move dist\OBS-Backup-Restore.exe ${{ matrix.asset }}
        shell: cmd

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/OBS Backup & Restore.app" ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.asset }} -C dist OBS-Backup-Restore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: cd assets && sha256sum * > SHA256SUMS.txt
      - name: Fill in repository links
        run: sed -i "s|REPO_URL|${{ github.server_url }}/${{ github.repository }}|g" .github/RELEASE_NOTES_TEMPLATE.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: assets/*
          body_path: .github/RELEASE_NOTES_TEMPLATE.md
          generate_release_notes: true
