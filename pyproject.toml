[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backup-restore-for-obs"
dynamic = ["version"]
description = "Back up and restore OBS Studio profiles, scene collections, sources and settings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "PySide6-Essentials>=6.12",
    "psutil>=7.2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/OliverGras/backup-restore-for-obs"
Issues = "https://github.com/OliverGras/backup-restore-for-obs/issues"

[project.gui-scripts]
backup-restore-for-obs = "obs_backup.__main__:main"

# Development tools; `uv sync` installs them by default.
[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
    "ruff>=0.17.6",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
]

[tool.hatch.version]
path = "src/obs_backup/__init__.py"  # the only place the version is set

[tool.hatch.build.targets.wheel]
packages = ["src/obs_backup"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]  # tests/ for the shared helpers in tests/support.py
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

# Pylance / Pyright in the editor: check against Python 3.15 and the uv environment.
[tool.pyright]
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade (outdated syntax), bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter; long texts may stay long

[tool.ruff.lint.isort]
known-first-party = ["obs_backup"]
known-local-folder = ["support"]
