[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-backup-restore"
version = "0.1.0"
description = "Back up and restore OBS Studio profiles, scene collections, sources and settings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "psutil>=5.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/OliverGras/obs_backup_restore"
Issues = "https://github.com/OliverGras/obs_backup_restore/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.gui-scripts]
obs-backup-restore = "obs_backup.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obs_backup"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
